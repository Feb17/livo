<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7ba5"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="play" gradientUnits="userSpaceOnUse" x1="440" y1="430" x2="625" y2="635">
      <stop offset="0" stop-color="#ff6f9e"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <!-- 底板：macOS 图标网格，四周留 100 -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#gloss)"/>
  <!-- 飘过的弹幕 -->
  <rect x="292" y="236" width="268" height="46" rx="23" fill="#ffffff" fill-opacity="0.92"/>
  <rect x="590" y="236" width="142" height="46" rx="23" fill="#ffffff" fill-opacity="0.55"/>
  <!-- 直播画面 -->
  <rect x="232" y="326" width="560" height="410" rx="98" fill="#ffffff"/>
  <circle cx="306" cy="398" r="20" fill="#ff4757"/>
  <!-- 圆角播放键 -->
  <path d="M462 452 L462 612 L602 532 Z" fill="url(#play)" stroke="url(#play)" stroke-width="44" stroke-linejoin="round"/>
</svg>
