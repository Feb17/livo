# 发版：Windows x64 portable 包 + macOS Apple silicon dmg（参考 SlotSun/dart_simple_live 的 publish_app_release）
# - 推送 v* 标签：构建并发布到对应的 GitHub Release。标题、更新说明、是否预发行都读 app_version.json，
#   发版前先改好它并提交；标签和文件里的版本号不一致会直接失败
# - 手动运行：构建指定 ref，产物上传到 Actions；ref 是标签且勾选 upload_release 时也发布
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的 Git ref，例如 master 或 v0.1.0"
        required: false
        default: "master"
      upload_release:
        description: "ref 是标签时，把产物上传到对应的 GitHub Release"
        required: false
        default: false
        type: boolean

# 同一个 ref 的发版排队执行，避免重复触发时互相覆盖 Release
concurrency:
  group: release-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  REF: ${{ inputs.ref || github.ref }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_tag: ${{ steps.v.outputs.is_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - id: v
        shell: bash
        run: |
          ref="${REF#refs/tags/}"
          if [[ "$ref" == v* ]]; then
            # v0.1.2 之前的标签没有 app_version.json，跳过核对
            if [[ -f app_version.json ]]; then
              file=$(jq -r .version app_version.json)
              if [[ "$file" != "${ref#v}" ]]; then
                echo "::error::标签 $ref 与 app_version.json 里的版本 $file 不一致"
                exit 1
              fi
            fi
            echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(grep -m1 '^version' app/Cargo.toml | cut -d'"' -f2)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 下载 libmpv 开发包
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # shinchiro/mpv-winbuild-cmake 的 x86_64 开发包（不要 v3/AVX2 变体，兼容老 CPU）。
          # 固定版本并校验（同原项目 media_kit_libs_windows_video），每次发版用同一个 libmpv；升级时改这三个值
          $release = "20261021"
          $asset = "mpv-dev-x86_64-$release-git-e471496c56.7z"
          $sha256 = "efc719eff3dc5954b4a5efc800632808bcec01cc9034940dd14e5eb7fe9ea633"
          gh release download $release --repo shinchiro/mpv-winbuild-cmake --pattern $asset --output mpv-dev.7z
          if ((Get-FileHash mpv-dev.7z -Algorithm SHA256).Hash -ne $sha256) { throw "$asset 的 SHA-256 不符" }
          7z x mpv-dev.7z -ompv | Out-Null
          # MSVC 链接器可以直接使用 MinGW 的导入库，改名成 #[link(name = "mpv")] 要找的 mpv.lib
          Copy-Item mpv/libmpv.dll.a mpv/mpv.lib
          "MPV_LIB_DIR=$pwd\mpv" >> $env:GITHUB_ENV

      - name: 构建
        run: cargo build --release -p livo

      - name: 打包 portable
        shell: pwsh
        run: |
          $name = "Livo-Windows-x64-v${{ needs.version.outputs.version }}-portable"
          New-Item -ItemType Directory -Path "dist/$name" -Force | Out-Null
          Copy-Item target/release/livo.exe "dist/$name/Livo.exe"
          Copy-Item mpv/libmpv-2.dll "dist/$name/"
          Copy-Item LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.zip

  build-macos:
    needs: version
    runs-on: macos-15 # Apple silicon
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # 脚本自己下载 media-kit 的精简版 libmpv，不再需要 Homebrew 的 mpv
      - name: 构建并打包 dmg
        run: scripts/bundle-macos.sh "${{ needs.version.outputs.version }}"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.dmg

  release:
    needs: [version, build-windows, build-macos]
    if: needs.version.outputs.is_tag == 'true' && (github.event_name == 'push' || inputs.upload_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
          sparse-checkout: app_version.json
          sparse-checkout-cone-mode: false
      - name: 读取更新说明
        id: meta
        # 旧标签没有这个文件：不传更新说明，已有 Release 的正文保持不变
        run: |
          if [[ -f app_version.json ]]; then
            echo "prerelease=$(jq -r .prerelease app_version.json)" >> "$GITHUB_OUTPUT"
            jq -r .version_desc app_version.json > notes.md
            echo "notes=notes.md" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: 签名安装包
        # App 自动更新时用内置公钥校验 .sig，没有签名的包不会被自动安装
        env:
          KEY: ${{ secrets.LIVO_UPDATE_KEY }}
        run: |
          test -n "$KEY" || { echo "缺少仓库 secret LIVO_UPDATE_KEY（Ed25519 私钥 PEM）"; exit 1; }
          printf '%s\n' "$KEY" > key.pem
          for f in artifacts/*/*.dmg artifacts/*/*.zip; do openssl pkeyutl -sign -inkey key.pem -rawin -in "$f" -out "$f.sig"; done
          rm key.pem
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          body_path: ${{ steps.meta.outputs.notes }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: artifacts/**/*
