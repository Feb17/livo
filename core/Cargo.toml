[package]
name = "livo_core"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "gzip", "brotli", "system-proxy"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
serde_json = "1"
md5 = "0.7"
flate2 = "1"
brotli = "9"
regex = "1"
anyhow = "1"
base64 = "0.22"
